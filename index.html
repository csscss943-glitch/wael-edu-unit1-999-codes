<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دخول الطلاب - وائل الجوجري</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;background:#0A1931;color:#e6eefc;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.bg{position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.04) 1px,transparent 1px);background-size:38px 38px}
.card{position:relative;z-index:1;max-width:480px;width:100%;background:rgba(17,34,64,0.9);border:2px solid rgba(255,201,71,0.4);border-radius:20px;padding:32px;box-shadow:0 0 40px rgba(0,212,255,0.2);text-align:center}
.title{font-size:28px;font-weight:900;background:linear-gradient(90deg,#FFC947,#FFE9A0,#FFC947);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.sub{color:#8fb4ff;font-size:16px;margin-bottom:20px}
.input{width:100%;padding:14px 16px;border-radius:12px;border:2px solid rgba(0,212,255,0.3);background:#0f2342;color:#fff;font-family:inherit;font-size:20px;text-align:center;letter-spacing:2px;margin-bottom:14px}
.input:focus{outline:none;border-color:#00D4FF;box-shadow:0 0 15px rgba(0,212,255,0.4)}
.btn{width:100%;padding:14px;background:linear-gradient(90deg,#FFC947,#FFA500);color:#0A1931;border:none;border-radius:12px;font-family:inherit;font-weight:900;font-size:18px;cursor:pointer;transition:0.3s}
.btn:hover{transform:scale(1.02);box-shadow:0 0 20px rgba(255,201,71,0.5)}
.msg{margin-top:12px;padding:10px;border-radius:8px;display:none;font-size:14px}
.msg.error{background:rgba(239,68,68,0.15);border:1px solid #ef4444;color:#fca5a5;display:block}
.msg.ok{background:rgba(34,197,94,0.15);border:1px solid #22c55e;color:#86efac;display:block}
.footer{margin-top:18px;font-size:12px;color:#7aa0d0}
.badge{display:inline-block;background:rgba(0,212,255,0.15);border:1px solid rgba(0,212,255,0.3);border-radius:20px;padding:4px 12px;font-size:12px;color:#00D4FF;margin-bottom:12px}
</style>
</head>
<body>
<div class="bg"></div>
<div class="card">
<div class="badge">🔒 دخول محمي بكود الطالب</div>
<div class="title">الوحدة الأولى كاملة</div>
<div class="sub">البرمجة والذكاء الاصطناعي - الصف الثاني الثانوي<br>أدخل كود الطالب المكون من 1 إلى 999</div>
<input id="codeInput" class="input" placeholder="مثال: ******-042 أو 42" maxlength="10" />
<button class="btn" onclick="verify()">دخول للموقع 🚀</button>
<div id="msg" class="msg"></div>
<div style="margin-top:16px;text-align:right;background:rgba(0,212,255,0.06);border-radius:10px;padding:12px;font-size:13px;line-height:1.8">
<b style="color:#FFC947">الأكواد المتاحة:</b>
<b style="color:#00D4FF">إجمالي الأكواد:  كود</b>
</div>
<div class="footer">إعداد: وائل الجوجري - 01061641240 | البكالوريا المصرية 2026</div>
</div>
<script src="codes.js"></script>
<script>
function verify(){
  const input = document.getElementById('codeInput').value.trim().toUpperCase();
  const msg = document.getElementById('msg');
  if(!input){msg.className='msg error';msg.textContent='من فضلك أدخل الكود';return;}
  // normalize: if number like 42 convert to WAEL-042 and also plain 42
  let normalized = input;
  if(/^\d{1,3}$/.test(input)){
    let num = parseInt(input);
    if(num>=1 && num<=999){
      normalized = num.toString();
    }
  }
  // check
  let ok = false;
  if(VALID_CODES.has(normalized) || VALID_CODES.has(input)){
    ok = true;
  } else {
    // try WAEL-XXX format
    if(/^\d{1,3}$/.test(input)){
      let padded = "WAEL-" + input.padStart(3,'0');
      if(VALID_CODES.has(padded)) ok = true;
    }
  }
  if(ok){
    msg.className='msg ok';
    msg.textContent='✅ كود صحيح - جاري الدخول...';
    localStorage.setItem('student_code', normalized);
    localStorage.setItem('access_granted', 'true');
    setTimeout(()=>{window.location.href='content/index.html';}, 800);
  } else {
    msg.className='msg error';
    msg.textContent='❌ الكود غير مسجل - تأكد من الرقم من 1 إلى 999';
  }
}
document.getElementById('codeInput').addEventListener('keypress', function(e){ if(e.key==='Enter') verify(); });
// if already logged
if(localStorage.getItem('access_granted')==='true'){
  // auto redirect
  // window.location.href='content/index.html';
}
</script>
</body>
</html>
